version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algonox_secretary_dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - dashboard_data:/app/data

volumes:
  dashboard_data:
    driver: local
